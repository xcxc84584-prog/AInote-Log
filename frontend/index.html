## 1. 基本操作
- 使用左側 Explorer 管理資料夾與文件。
- 按「＋文件」建立文件，右鍵節點可重新命名、刪除、複製或移動。
- 點擊「儲存」下載 Markdown，或使用「另存」指定檔案。

## 2. 一般文本模式
右上角「數學式文本」**不勾選**時，可編輯並顯示 Markdown 標題、清單、表格、程式碼與圖片。

| 功能 | 說明 |
| --- | --- |
| Explorer | 管理文件 |
| 儲存 | 保存 Markdown |

## 3. 數學式文本模式
勾選右上角「數學式文本」後，專注渲染 LaTeX 公式；切回一般模式可繼續編輯。

行內公式：\\(a^2+b^2=c^2\\)

多行公式：

$$
\\begin{aligned}
a+b&=c\\\\
a-b&=d
\\end{aligned}
$$

function toggleExplorer(show){$('explorer').classList.toggle('off',!show);$('resizer').style.display=show?'':'none';persist()}$('hideExplorer').onclick=()=>toggleExplorer(false);$('toolsBtn').onclick=e=>{let m=$('toolsMenu');m.hidden=!m.hidden;m.style.top=e.target.getBoundingClientRect().bottom+5+'px';m.style.left=Math.min(e.target.getBoundingClientRect().left,innerWidth-190)+'px'};$('toolsMenu').onclick=e=>{let x=e.target.dataset.tool;if(!x)return;$('toolsMenu').hidden=true;if(x==='export')download(current()?.name||'未命名.md',$('source').value);if(x==='render'){syncEditor();render()}if(x==='explorer')toggleExplorer($('explorer').classList.contains('off'))};$('saveBtn').onclick=save;$('saveAsBtn').onclick=saveAs;$('newBtn').onclick=async()=>{let name=await modal('新文件','未命名.md');if(name)addNode('file',nodes.find(n=>n.parent===null)?.id||null,name)};$('openBtn').onclick=async()=>{if(window.showOpenFilePicker){try{let [h]=await window.showOpenFilePicker({types:[{description:'Markdown',accept:{'text/markdown':['.md','.markdown','.txt']}}]});let f=await h.getFile();let n=addNode('file',nodes.find(n=>n.parent===null)?.id||null,f.name,await f.text());fileHandles[n.id]=h;loadActive();return}catch(e){if(e.name==='AbortError')return}}$('fileInput').click()};$('fileInput').onchange=async e=>{let f=e.target.files[0];if(f)addNode('file',nodes.find(n=>n.parent===null)?.id||null,f.name,await f.text());e.target.value=''};
$('addFile').onclick=async()=>{let n=nodes.find(n=>n.id===active),name=await modal('新增文件','新文件.md');if(name)addNode('file',n?.parent??nodes.find(x=>x.parent===null)?.id,name)};$('addFolder').onclick=async()=>{let n=nodes.find(n=>n.id===active),name=await modal('新增資料夾','新資料夾');if(name)addNode('folder',n?.parent??nodes.find(x=>x.parent===null)?.id,name)};
$('folderBtn').onclick=async()=>{if(window.showDirectoryPicker){try{folderHandle=await window.showDirectoryPicker({mode:'readwrite'});await loadFolder(folderHandle);return}catch(e){if(e.name==='AbortError')return;status('資料夾存取受限，請改用匯入：'+e.message)}}$('folderInput').click()};async function loadFolder(handle){let root=defaultRoot();root.name=handle.name;let result=[root],handles={};async function walk(h,parent,depth){if(depth>12)return;for await(let [name,entry]of h.entries()){if(name.startsWith('.'))continue;let type=entry.kind==='directory'?'folder':'file';if(type==='file'&&!/\.(md|markdown|txt)$/i.test(name))continue;let n={id:uid(),name,type,parent,order:result.filter(x=>x.parent===parent).length,open:depth<2,content:type==='file'?await(await entry.getFile()).text():''};result.push(n);if(type==='file')handles[n.id]=entry;else await walk(entry,n.id,depth+1)}}await walk(handle,root.id,0);commit();nodes=result;fileHandles=handles;active=nodes.find(n=>n.type==='file')?.id||null;loadActive();tree();persist();status('已開啟資料夾：'+handle.name)}$('folderInput').onchange=async e=>{let list=[...e.target.files],root=defaultRoot();root.name=list[0]?.webkitRelativePath?.split('/')[0]||'匯入資料夾';let result=[root],dirs=new Map([['',root.id]]);for(let f of list){if(!/\.(md|markdown|txt)$/i.test(f.name))continue;let parts=f.webkitRelativePath.split('/').slice(1),path='';let parent=root.id;for(let part of parts.slice(0,-1)){path+='/'+part;if(!dirs.has(path)){let n={id:uid(),name:part,type:'folder',parent,order:result.filter(x=>x.parent===parent).length,open:true,content:''};result.push(n);dirs.set(path,n.id)}parent=dirs.get(path)}result.push({id:uid(),name:f.name,type:'file',parent,order:result.filter(x=>x.parent===parent).length,content:await f.text()})}commit();nodes=result;fileHandles={};folderHandle=null;active=nodes.find(n=>n.type==='file')?.id||null;loadActive();tree();persist();status('已匯入資料夾快照；修改後請使用保存下載備份');e.target.value=''};
$('folderSave').onclick=async()=>{commit();if(folderHandle){try{await syncFolder();status('已將 Explorer 文件保存至授權資料夾');return}catch(e){status('資料夾保存失敗：'+e.message)}}let data=JSON.stringify({version:1,nodes,active},null,2);download('ainote-explorer-backup.json',data);status('已下載 Explorer JSON 備份（非原資料夾寫入）')};async function syncFolder(){async function ensure(parentHandle,n){if(n.type==='folder'){let h=await parentHandle.getDirectoryHandle(n.name,{create:true});for(let ch of siblings(n.id))await ensure(h,ch)}else{let h=await parentHandle.getFileHandle(n.name,{create:true});let w=await h.createWritable();await w.write(n.content);await w.close()}}let root=nodes.find(n=>n.parent===null);for(let n of siblings(root.id))await ensure(folderHandle,n)}$('folderClose').onclick=async()=>{let ok=await modal('關閉 Explorer','', '將關閉目前 Explorer 工作區。請先保存需要的檔案。',false);if(ok!==null){commit();folderHandle=null;fileHandles={};nodes=[defaultRoot()];active=null;loadActive();tree();persist();status('Explorer 已關閉')}};
let resize=false;$('resizer').onpointerdown=e=>{resize=true;$('resizer').setPointerCapture(e.pointerId)};$('resizer').onpointermove=e=>{if(resize)$('explorer').style.width=Math.max(160,Math.min(innerWidth*.55,e.clientX))+'px'};$('resizer').onpointerup=()=>resize=false;document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}if(e.key==='Escape'){$('toolsMenu').hidden=true;$('contextMenu').hidden=true}});restore();
</script></body></html>
